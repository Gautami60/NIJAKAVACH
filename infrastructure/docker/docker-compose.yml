services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Logical Schema Partitioning)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nijakavach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nijakavach_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nijakavach_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Caching, Sliding Window Rate Limiting, Redlock)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nijakavach_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis_dev_secret", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. RabbitMQ 3.13 (Work Queues, Topic Exchanges, DLX)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nijakavach_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nijakavach
      RABBITMQ_DEFAULT_PASS: rabbit_dev_password
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Web Management Console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MinIO (S3-Compatible Object Storage for Evidence & Snapshots)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: nijakavach_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Bucket provisioner for MinIO
  minio-init:
    image: minio/mc:RELEASE.2024-03-14T05-24-34Z
    container_name: nijakavach_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/nijakavach-evidence-dev || true;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
